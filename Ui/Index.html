<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= STATUS ================= -->


    <div class="status-bar">

        <div class="status-light"></div>

        <div class="status-text">
            <span id="status">ACTIVE</span>
            <small id="status-detail">NOVA is ready</small>
        </div>

    </div>


    <!-- ================= NOVA TITLE ================= -->

    <div class="nova-title">
        NOV<span>A</span>

        <div class="nova-star">✦</div>

        <div class="title-line"></div>
    </div>


    <!-- ================= NEURAL GLOBE ================= -->

    <main class="globe-container">

        <div class="globe">

            <!-- Outer rings -->
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>

            <!-- Latitude -->
            <div class="latitude latitude-1"></div>
            <div class="latitude latitude-2"></div>
            <div class="latitude latitude-3"></div>
            <div class="latitude latitude-4"></div>

            <!-- Longitude -->
            <div class="longitude longitude-1"></div>
            <div class="longitude longitude-2"></div>
            <div class="longitude longitude-3"></div>
            <div class="longitude longitude-4"></div>

            <!-- Neural network -->
            <div class="network">

                <span class="node n1"></span>
                <span class="node n2"></span>
                <span class="node n3"></span>
                <span class="node n4"></span>
                <span class="node n5"></span>
                <span class="node n6"></span>
                <span class="node n7"></span>
                <span class="node n8"></span>
                <span class="node n9"></span>
                <span class="node n10"></span>
                <span class="node n11"></span>
                <span class="node n12"></span>
                <span class="node n13"></span>
                <span class="node n14"></span>
                <span class="node n15"></span>
                <span class="node n16"></span>
                <span class="node n17"></span>
                <span class="node n18"></span>
                <span class="node n19"></span>
                <span class="node n20"></span>

                <span class="line l1"></span>
                <span class="line l2"></span>
                <span class="line l3"></span>
                <span class="line l4"></span>
                <span class="line l5"></span>
                <span class="line l6"></span>
                <span class="line l7"></span>
                <span class="line l8"></span>
                <span class="line l9"></span>
                <span class="line l10"></span>
                <span class="line l11"></span>
                <span class="line l12"></span>
                <span class="line l13"></span>
                <span class="line l14"></span>
                <span class="line l15"></span>
                <span class="line l16"></span>

            </div>


            <!-- NOVA Core -->

            <div class="core">

                <div class="core-glow"></div>

                <span>NOVA</span>

            </div>

        </div>

    </main>


    <!-- ================= TASK PANEL ================= -->

    <aside class="task-panel">

        <div class="task-header">
            <span>WORK</span>

            <div class="task-indicator"></div>
        </div>

        <div id="task-content" class="task-content">

            <div class="idle">

                <div class="idle-dot"></div>

                <div>
                    <strong>IDLE</strong>
                    <small>No active tasks</small>
                </div>

            </div>

        </div>

    </aside>


    <!-- ================= CHATBOX ================= -->

    <div class="chatbox">

        <div class="chat-icon">
            ✦
        </div>

        <input
            id="chat-input"
            type="text"
            placeholder="Ask NOVA anything..."
            autocomplete="off"
        >

        <button id="send-button">
            ➤
        </button>

    </div>


    <script src="script.js"></script></body>

</html>
